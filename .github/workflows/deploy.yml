name: Build and Deploy (self-hosted runner)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, azure, vnet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (VM managed identity)
        run: az login --identity --client-id ${{ vars.AZURE_CLIENT_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image pipeline-test:${{ github.sha }} \
            --image pipeline-test:latest \
            --file Dockerfile \
            .

      - name: Deploy new revision to Container App
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/pipeline-test:${{ github.sha }} \
            --set-env-vars APP_VERSION=${{ github.sha }}

      - name: Ensure ingress target port is 8080
        run: |
          az containerapp ingress update \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --target-port 8080

      - name: Wait and verify health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "App URL: https://$FQDN"
          echo "Waiting for the new revision to come up..."
          for i in $(seq 1 10); do
            sleep 15
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Healthy! Response:"
              curl -s "https://$FQDN/health"
              exit 0
            fi
          done
          echo "App did not become healthy in time"
          exit 1